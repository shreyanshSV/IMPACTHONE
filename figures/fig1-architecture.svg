<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="920" height="560" fill="#ffffff"/>
  <text x="460" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">ShareSecure — Components &amp; Trust Boundary</text>

  <!-- operator trust boundary -->
  <rect x="220" y="64" width="600" height="338" rx="12" fill="none" stroke="#64748b" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="520" y="86" text-anchor="middle" font-size="13" font-style="italic" fill="#475569">Operator trust boundary</text>

  <!-- external actors -->
  <g>
    <rect x="24" y="98" width="150" height="52" rx="9" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="99" y="120" text-anchor="middle" font-size="13" fill="#0f172a">Owner</text>
    <text x="99" y="138" text-anchor="middle" font-size="13" fill="#0f172a">browser</text>

    <rect x="24" y="300" width="150" height="60" rx="9" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="99" y="324" text-anchor="middle" font-size="13" fill="#0f172a">Recipient browser</text>
    <text x="99" y="342" text-anchor="middle" font-size="12" fill="#475569">/share/:id</text>
  </g>

  <!-- server-side boxes -->
  <g>
    <rect x="250" y="104" width="150" height="56" rx="9" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/>
    <text x="325" y="128" text-anchor="middle" font-size="13" fill="#0f172a">Express server</text>
    <text x="325" y="146" text-anchor="middle" font-size="11" fill="#475569">/api/shares*</text>

    <rect x="430" y="104" width="160" height="56" rx="9" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/>
    <text x="510" y="126" text-anchor="middle" font-size="13" fill="#0f172a">shareService</text>
    <text x="510" y="144" text-anchor="middle" font-size="11" fill="#475569">AES-GCM · scrypt · KDF</text>

    <rect x="620" y="104" width="172" height="56" rx="9" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/>
    <text x="706" y="126" text-anchor="middle" font-size="13" fill="#0f172a">MongoDB</text>
    <text x="706" y="144" text-anchor="middle" font-size="11" fill="#475569">hashes · wrapped key</text>

    <rect x="250" y="220" width="200" height="56" rx="9" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.6"/>
    <text x="350" y="244" text-anchor="middle" font-size="13" fill="#0f172a">IPFS / Pinata</text>
    <text x="350" y="262" text-anchor="middle" font-size="11" fill="#0e7490">ciphertext only</text>

    <rect x="500" y="220" width="292" height="56" rx="9" fill="#fef2f2" stroke="#ef4444" stroke-width="1.4"/>
    <text x="646" y="244" text-anchor="middle" font-size="12.5" fill="#0f172a">master key M lives in server env</text>
    <text x="646" y="262" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b91c1c">NEVER in the database</text>
  </g>

  <!-- outside-boundary services -->
  <g>
    <rect x="470" y="436" width="150" height="58" rx="9" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="545" y="460" text-anchor="middle" font-size="13" fill="#0f172a">Email provider</text>
    <text x="545" y="478" text-anchor="middle" font-size="11" fill="#475569">link / code only</text>

    <rect x="650" y="436" width="170" height="58" rx="9" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="735" y="460" text-anchor="middle" font-size="13" fill="#0f172a">Blockchain (Sepolia)</text>
    <text x="735" y="478" text-anchor="middle" font-size="11" fill="#475569">authenticity only · no share data</text>
  </g>

  <!-- arrows -->
  <line x1="174" y1="124" x2="248" y2="128" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="205" y="116" text-anchor="middle" font-size="11" fill="#475569">TLS</text>

  <line x1="174" y1="326" x2="248" y2="150" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="196" y="245" text-anchor="middle" font-size="11" fill="#475569">TLS (open)</text>

  <line x1="400" y1="132" x2="428" y2="132" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="590" y1="132" x2="618" y2="132" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>

  <line x1="325" y1="160" x2="340" y2="218" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="300" y="195" text-anchor="middle" font-size="11" fill="#475569">ciphertext</text>

  <line x1="430" y1="160" x2="545" y2="434" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="430" y="330" text-anchor="middle" font-size="11" fill="#475569">link / code only</text>

  <text x="460" y="528" text-anchor="middle" font-size="12" fill="#334155">Plaintext only ever exists in the two browsers (and, Protected tier only, in server RAM during one authorised view).</text>
</svg>
