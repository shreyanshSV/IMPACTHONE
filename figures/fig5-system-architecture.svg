<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 760" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="8" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="980" height="760" fill="#ffffff"/>
  <text x="490" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">DocVerify — System Architecture</text>

  <!-- ===================== LAYER 1: USERS ===================== -->
  <rect x="30" y="54" width="920" height="86" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="46" y="76" font-size="11" font-weight="700" fill="#64748b">USERS</text>
  <rect x="60" y="84" width="270" height="44" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.4"/>
  <text x="195" y="103" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Issuer (organisation)</text>
  <text x="195" y="119" text-anchor="middle" font-size="11" fill="#713f12">MetaMask wallet · pays gas</text>
  <rect x="360" y="84" width="270" height="44" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.4"/>
  <text x="495" y="103" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Recipient (User Portal)</text>
  <text x="495" y="119" text-anchor="middle" font-size="11" fill="#075985">email + OTP login · optional wallet</text>
  <rect x="660" y="84" width="260" height="44" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.4"/>
  <text x="790" y="103" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">External viewer</text>
  <text x="790" y="119" text-anchor="middle" font-size="11" fill="#065f46">temporary share link · no account</text>

  <!-- ===================== LAYER 2: FRONTEND ===================== -->
  <rect x="30" y="158" width="920" height="76" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="46" y="180" font-size="11" font-weight="700" fill="#64748b">FRONTEND (vanilla JS + Tailwind)</text>
  <rect x="60" y="188" width="270" height="36" rx="8" fill="#fefce8" stroke="#ca8a04"/>
  <text x="195" y="211" text-anchor="middle" font-size="12.5" fill="#0f172a">Issuer Portal</text>
  <rect x="360" y="188" width="270" height="36" rx="8" fill="#eff6ff" stroke="#0284c7"/>
  <text x="495" y="211" text-anchor="middle" font-size="12.5" fill="#0f172a">User Portal (dashboard · authenticity · received)</text>
  <rect x="660" y="188" width="260" height="36" rx="8" fill="#f0fdf4" stroke="#10b981"/>
  <text x="790" y="211" text-anchor="middle" font-size="12.5" fill="#0f172a">Public share page  /share/:id</text>

  <!-- ===================== LAYER 3: BACKEND ===================== -->
  <rect x="30" y="252" width="920" height="128" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/>
  <text x="46" y="274" font-size="11" font-weight="700" fill="#4338ca">BACKEND — Node.js / Express (single server)</text>
  <rect x="60" y="284" width="200" height="40" rx="8" fill="#ffffff" stroke="#6366f1"/>
  <text x="160" y="301" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Auth</text>
  <text x="160" y="316" text-anchor="middle" font-size="10.5" fill="#475569">sessions · OTP · wallet signatures</text>
  <rect x="280" y="284" width="200" height="40" rx="8" fill="#ffffff" stroke="#6366f1"/>
  <text x="380" y="301" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Issuer publish</text>
  <text x="380" y="316" text-anchor="middle" font-size="10.5" fill="#475569">watermark → fingerprint → encrypt</text>
  <rect x="500" y="284" width="200" height="40" rx="8" fill="#ffffff" stroke="#6366f1"/>
  <text x="600" y="301" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">4-Layer Authenticity Check</text>
  <text x="600" y="316" text-anchor="middle" font-size="10.5" fill="#475569">SHA-256 · watermark · pHash · chain</text>
  <rect x="720" y="284" width="200" height="40" rx="8" fill="#ffffff" stroke="#6366f1"/>
  <text x="820" y="301" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">ShareSecure</text>
  <text x="820" y="316" text-anchor="middle" font-size="10.5" fill="#475569">expiring encrypted shares · revoke</text>
  <rect x="60" y="332" width="420" height="38" rx="8" fill="#ffffff" stroke="#6366f1"/>
  <text x="270" y="348" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Vault (AES-256-GCM)</text>
  <text x="270" y="363" text-anchor="middle" font-size="10.5" fill="#475569">every file encrypted before storage · master key in server env only</text>
  <rect x="500" y="332" width="420" height="38" rx="8" fill="#ffffff" stroke="#6366f1"/>
  <text x="710" y="348" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Watermark micro-service (self-hosted Python)</text>
  <text x="710" y="363" text-anchor="middle" font-size="10.5" fill="#475569">invisible DWT-DCT mark · embeds + verifies doc ID</text>

  <!-- ===================== LAYER 4: DATA & TRUST ===================== -->
  <rect x="30" y="398" width="920" height="104" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="46" y="420" font-size="11" font-weight="700" fill="#64748b">DATA &amp; TRUST</text>
  <rect x="60" y="430" width="270" height="60" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.4"/>
  <text x="195" y="450" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">MongoDB</text>
  <text x="195" y="466" text-anchor="middle" font-size="10.5" fill="#475569">users · document records · shares (TTL)</text>
  <text x="195" y="481" text-anchor="middle" font-size="10.5" fill="#475569">audit logs · only hashes of secrets</text>
  <rect x="360" y="430" width="270" height="60" rx="8" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.4"/>
  <text x="495" y="450" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">IPFS (Pinata)</text>
  <text x="495" y="466" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0e7490">ciphertext only — can never read a file</text>
  <text x="495" y="481" text-anchor="middle" font-size="10.5" fill="#475569">content-addressed storage (CID)</text>
  <rect x="660" y="430" width="260" height="60" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="790" y="450" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">Ethereum Sepolia</text>
  <text x="790" y="466" text-anchor="middle" font-size="10.5" fill="#5b21b6">DocVerifyRegistry contract</text>
  <text x="790" y="481" text-anchor="middle" font-size="10.5" fill="#475569">keccak-256 file hash · issuer · receiver</text>

  <!-- ===================== LAYER 5: NOTIFICATIONS ===================== -->
  <rect x="30" y="520" width="920" height="76" rx="10" fill="#fff7ed" stroke="#f59e0b" stroke-dasharray="6 4"/>
  <text x="46" y="542" font-size="11" font-weight="700" fill="#92400e">NOTIFICATIONS — data-minimal (links &amp; codes only, never the document)</text>
  <rect x="60" y="550" width="420" height="36" rx="8" fill="#ffffff" stroke="#f59e0b"/>
  <text x="270" y="573" text-anchor="middle" font-size="12" fill="#0f172a">Gmail SMTP — one-time codes · share links · delivery notices</text>
  <rect x="500" y="550" width="420" height="36" rx="8" fill="#ffffff" stroke="#f59e0b"/>
  <text x="710" y="573" text-anchor="middle" font-size="12" fill="#0f172a">n8n (VPS) — webhook on verification → WhatsApp + Email</text>

  <!-- ===================== connecting arrows ===================== -->
  <line x1="195" y1="128" x2="195" y2="186" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="495" y1="128" x2="495" y2="186" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="790" y1="128" x2="790" y2="186" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="195" y1="224" x2="195" y2="250" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="495" y1="224" x2="495" y2="250" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="790" y1="224" x2="790" y2="250" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="195" y1="380" x2="195" y2="428" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="495" y1="380" x2="495" y2="428" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="790" y1="380" x2="790" y2="428" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="490" y1="502" x2="490" y2="518" stroke="#92400e" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  <!-- issuer publishes on-chain directly via MetaMask -->
  <path d="M 330 106 C 940 96, 950 300, 905 428" fill="none" stroke="#7c3aed" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  <text x="925" y="240" text-anchor="middle" font-size="10.5" fill="#7c3aed" transform="rotate(90 925 240)">issuer signs tx via MetaMask</text>

  <!-- ===================== FLOWS legend ===================== -->
  <rect x="30" y="614" width="920" height="128" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="46" y="636" font-size="12" font-weight="700" fill="#334155">MAIN FLOWS</text>
  <circle cx="60" cy="656" r="9" fill="#ca8a04"/><text x="60" y="660" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">1</text>
  <text x="78" y="660" font-size="12" fill="#0f172a"><tspan font-weight="600">Publish:</tspan> issuer uploads → invisible watermark + fingerprints (SHA-256, pHash) → AES-256 encrypt → ciphertext to IPFS · keccak-256 hash on-chain · record in MongoDB → recipient notified.</text>
  <circle cx="60" cy="684" r="9" fill="#0284c7"/><text x="60" y="688" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">2</text>
  <text x="78" y="688" font-size="12" fill="#0f172a"><tspan font-weight="600">Authenticate:</tspan> recipient uploads any file → 4 layers compare it to the registered original (exact hash · watermark · perceptual hash · on-chain record) → verdict → WhatsApp/email via n8n.</text>
  <circle cx="60" cy="712" r="9" fill="#10b981"/><text x="60" y="716" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">3</text>
  <text x="78" y="716" font-size="12" fill="#0f172a"><tspan font-weight="600">Share:</tspan> owner creates a temporary encrypted link (expiry · password/email-code · view cap) → external viewer opens watermarked view-only copy → expiry/revoke destroys the key forever.</text>
</svg>
