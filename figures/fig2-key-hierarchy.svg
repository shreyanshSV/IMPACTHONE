<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="640" height="430" fill="#ffffff"/>
  <text x="320" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">Protected-tier Key Hierarchy</text>

  <!-- boxes -->
  <rect x="120" y="60" width="400" height="56" rx="9" fill="#fef2f2" stroke="#ef4444" stroke-width="1.6"/>
  <text x="320" y="84" text-anchor="middle" font-size="13.5" fill="#0f172a">DOC_MASTER_KEY  M</text>
  <text x="320" y="102" text-anchor="middle" font-size="11.5" fill="#b91c1c">256-bit · server environment only · never in DB</text>

  <rect x="120" y="158" width="400" height="56" rx="9" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="320" y="182" text-anchor="middle" font-size="13.5" fill="#0f172a">Wrapping key  K_w = KDF(M, "share-wrap-v1")</text>
  <text x="320" y="200" text-anchor="middle" font-size="11.5" fill="#92400e">scrypt · fixed label = domain separation from vault</text>

  <rect x="120" y="256" width="400" height="56" rx="9" fill="#fefce8" stroke="#ca8a04" stroke-width="1.6"/>
  <text x="320" y="280" text-anchor="middle" font-size="13.5" fill="#0f172a">Per-share DEK  k_s  ←  random 256-bit</text>
  <text x="320" y="298" text-anchor="middle" font-size="11.5" fill="#854d0e">fresh per share · isolation · per-share erasure</text>

  <rect x="120" y="354" width="400" height="50" rx="9" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/>
  <text x="320" y="384" text-anchor="middle" font-size="13.5" fill="#0f172a">Document plaintext  P</text>

  <!-- arrows -->
  <line x1="320" y1="116" x2="320" y2="156" stroke="#475569" stroke-width="1.7" marker-end="url(#arr)"/>
  <text x="360" y="140" font-size="11.5" fill="#475569">derive</text>
  <line x1="320" y1="214" x2="320" y2="254" stroke="#475569" stroke-width="1.7" marker-end="url(#arr)"/>
  <text x="360" y="238" font-size="11.5" fill="#475569">wrap</text>
  <line x1="320" y1="312" x2="320" y2="352" stroke="#475569" stroke-width="1.7" marker-end="url(#arr)"/>
  <text x="360" y="336" font-size="11.5" fill="#475569">encrypt</text>

  <!-- erasure note -->
  <text x="320" y="424" text-anchor="middle" font-size="11.5" fill="#334155">Destroy the wrapped DEK (on expiry/revoke) ⇒ the IPFS ciphertext is permanently unreadable (crypto-erasure).</text>
</svg>
