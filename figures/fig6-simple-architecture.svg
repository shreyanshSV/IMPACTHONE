<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="8" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="900" height="480" fill="#ffffff"/>
  <text x="450" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">DocVerify — How It Works</text>

  <!-- top row -->
  <rect x="40" y="80" width="200" height="80" rx="12" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="140" y="115" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Issuer</text>
  <text x="140" y="138" text-anchor="middle" font-size="12.5" fill="#713f12">publishes a document</text>

  <rect x="330" y="70" width="240" height="100" rx="12" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="450" y="103" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">DocVerify Server</text>
  <text x="450" y="126" text-anchor="middle" font-size="12.5" fill="#3730a3">encrypts · watermarks</text>
  <text x="450" y="144" text-anchor="middle" font-size="12.5" fill="#3730a3">verifies · shares</text>

  <rect x="660" y="80" width="200" height="80" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="760" y="115" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Recipient</text>
  <text x="760" y="138" text-anchor="middle" font-size="12.5" fill="#14532d">views · checks · shares</text>

  <line x1="240" y1="120" x2="326" y2="120" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="570" y1="120" x2="656" y2="120" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- storage row -->
  <rect x="70" y="270" width="220" height="90" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="180" y="305" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">MongoDB</text>
  <text x="180" y="328" text-anchor="middle" font-size="12.5" fill="#475569">document records</text>

  <rect x="340" y="270" width="220" height="90" rx="12" fill="#cffafe" stroke="#0891b2" stroke-width="2"/>
  <text x="450" y="305" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">IPFS Storage</text>
  <text x="450" y="328" text-anchor="middle" font-size="12.5" fill="#155e75">encrypted files only</text>

  <rect x="610" y="270" width="220" height="90" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="720" y="305" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Ethereum</text>
  <text x="720" y="328" text-anchor="middle" font-size="12.5" fill="#5b21b6">document fingerprint</text>

  <line x1="380" y1="170" x2="200 " y2="266" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="450" y1="170" x2="450" y2="266" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="520" y1="170" x2="700" y2="266" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>

  <!-- notify -->
  <rect x="250" y="408" width="400" height="46" rx="12" fill="#fff7ed" stroke="#f59e0b" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="450" y="437" text-anchor="middle" font-size="13.5" fill="#92400e">WhatsApp + Email alerts — links only, never the document</text>
  <line x1="450" y1="360" x2="450" y2="404" stroke="#92400e" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/>
</svg>
