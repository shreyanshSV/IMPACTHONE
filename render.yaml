# Render Blueprint for DocVerify
# The app lives in docV/, so rootDir points there and the Dockerfile is ./Dockerfile
# relative to it. Secrets use `sync: false` -> set them in the Render dashboard,
# so they are NEVER committed to the repo.
services:
  - type: web
    name: docverify
    runtime: docker
    plan: free
    rootDir: docV
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # ---- secrets: set these in the Render dashboard (sync: false) ----
      - key: MONGODB_URI
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: WEB3_PROVIDER_URL
        sync: false
      - key: ACCOUNT_ADDRESS
        sync: false
      - key: PRIVATE_KEY
        sync: false
      - key: PINATA_API_KEY
        sync: false
      - key: PINATA_SECRET_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: DOC_MASTER_KEY
        sync: false
      - key: OCR_SERVICE_URL
        sync: false
