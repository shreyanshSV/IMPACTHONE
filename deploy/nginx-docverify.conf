# ============================================================================
#  DocVerify — nginx site config (put in /etc/nginx/sites-available/docverify)
#  Replace thecosmicdev.net with your real domain (e.g. docverify.example.com).
#  Certbot will add the HTTPS server block automatically.
# ============================================================================
server {
    listen 80;
    server_name thecosmicdev.net;

    # Uploads: multer allows 15 MB files; leave headroom for multipart overhead.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;           # IPFS pin/fetch can be slow
    }
}
