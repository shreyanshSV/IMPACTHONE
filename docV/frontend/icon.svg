<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f17"/>
      <stop offset="1" stop-color="#05080d"/>
    </linearGradient>
    <linearGradient id="doc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f6f8"/>
      <stop offset="1" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>
  <!-- background (full-bleed so it works as a maskable icon) -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- document -->
  <g>
    <path d="M176 118 h120 l52 52 v224 a12 12 0 0 1 -12 12 H176 a12 12 0 0 1 -12 -12 V130 a12 12 0 0 1 12 -12 Z" fill="url(#doc)"/>
    <path d="M296 118 v40 a12 12 0 0 0 12 12 h40 Z" fill="#94a3b8"/>
    <!-- text lines -->
    <rect x="196" y="210" width="120" height="12" rx="6" fill="#94a3b8"/>
    <rect x="196" y="238" width="120" height="12" rx="6" fill="#94a3b8"/>
    <rect x="196" y="266" width="78"  height="12" rx="6" fill="#94a3b8"/>
  </g>
  <!-- blockchain chain-link badge -->
  <g transform="translate(300 300)">
    <circle cx="40" cy="40" r="72" fill="#0a0f17" stroke="#38bdf8" stroke-width="8"/>
    <g fill="none" stroke="#38bdf8" stroke-width="14" stroke-linecap="round">
      <rect x="8"  y="30" width="40" height="26" rx="13"/>
      <rect x="32" y="30" width="40" height="26" rx="13"/>
    </g>
  </g>
</svg>
